</head><body><h1>Resetar dados do protótipo</h1><p>Apaga sessões, usuários, matérias e chat deste navegador. Ao abrir o login novamente, a conta principal é recriada automaticamente.</p><button id="r">Resetar</button><p id="m"></p><script>document.getElementById("r").onclick=()=>{localStorage.removeItem("fp_users");localStorage.removeItem("fp_session");localStorage.removeItem("fp_articles");localStorage.removeItem("fp_chat");location.href="login.html"};</script></body></html>
